name: claude-review

# Claude reviews PRs against the project rules (CONSTITUTION.md / GUIDELINES_CHEATSHEET.md).
# Requires the repo secret ANTHROPIC_API_KEY. Verify the action input names match
# the installed action version before relying on it.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR against the repository's CONSTITUTION.md and
            GUIDELINES_CHEATSHEET.md. Focus on: baseline-on-every-figure,
            provenance, no composite scores/rankings, the hexagon's dependency
            direction, thiserror/anyhow placement, and the "Done" definition.
