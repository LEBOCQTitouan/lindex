name: rust

# Runs only when the data plane changes (idiomatic per-path filtering).
on:
  push:
    paths: ["crates/**", "bin/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "bin/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/rust.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
