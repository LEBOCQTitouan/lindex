# cargo-deny supply-chain policy. Run: `just deny` (local) / CI job.
# Every `ignore`/exception must carry a reason and a drop-when-fixed intent.

[advisories]
version = 2
yanked = "deny"
# Only flag workspace-direct unmaintained crates, not transitive noise.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Starting allowlist — prune/extend after reading the actual license texts.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
# Our own crates are publish=false; don't require a license expression for them.
private = { ignore = true }

[bans]
# Blocking duplicate versions early in a small repo is churn — warn for now.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
